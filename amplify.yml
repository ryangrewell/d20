version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 24 && nvm use 24
    build:
      commands:
        - npm ci
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24 && nvm use 24
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run test -- --project unit --project web
        - VITE_BACKEND_MODE=amplify npx vite build
        # Public, non-secret backend endpoints for the SPA.
        - cp amplify_outputs.json dist/amplify_outputs.json
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
